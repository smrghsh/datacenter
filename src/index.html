<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data center — the whole earth hums</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas class="webgl"></canvas>

    <div id="view-toggle" role="radiogroup" aria-label="data view">
      <button data-view="columns" aria-checked="true">columns</button>
      <button data-view="heatmap" aria-checked="false">heatmap</button>
    </div>

    <div id="hud">
      <div class="glass">
        <div class="n" id="count">0</div>
        <div class="l">data centers · ATLAS dataset</div>
      </div>
      <div class="credit">
        source:
        <a
          href="https://github.com/Ringmast4r/Global-Data-Center-Map"
          target="_blank"
          rel="noopener"
          >Ringmast4r / Global-Data-Center-Map</a
        >
        ·
        <span id="coverage"></span> facilities geocoded (GeoNames)
      </div>
    </div>

    <div id="tooltip" hidden></div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
